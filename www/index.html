<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vault Calculator</title>
        <!-- 100% OFFLINE: tashqi math.js/CDN kerak emas -->
    <style>
        :root {
            --bg-color: #f4f7f6;
            --calc-bg: #ffffff;
            --text-primary: #191c1e;
            --text-secondary: #70777c;
            --btn-num-bg: #f8fafb;
            --btn-num-hover: #eef2f5;
            --btn-sci-bg: #edf4f1;
            --btn-sci-color: #006c4c;
            --btn-var-bg: #e0f2fe;
            --btn-var-color: #0369a1;
            --btn-op-color: #10b981;
            --btn-equal-bg: linear-gradient(135deg, #10b981, #059669);
            --btn-equal-shadow: rgba(16, 185, 129, 0.35);
            --card-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dark-mode {
            --bg-color: #0f1412;
            --calc-bg: #191e1c;
            --text-primary: #e1e3e0;
            --text-secondary: #89938f;
            --btn-num-bg: #222825;
            --btn-num-hover: #2c332f;
            --btn-sci-bg: #1c2b26;
            --btn-sci-color: #6eddbe;
            --btn-var-bg: #0c4a6e;
            --btn-var-color: #38bdf8;
            --btn-op-color: #34d399;
            --card-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            transition: background-color 0.4s ease;
        }

        .calculator-card {
            width: 380px;
            height: 780px;
            background: var(--calc-bg);
            border-radius: 36px;
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: var(--transition);
        }

        .calculator-card.landscape {
            width: 760px;
            height: 440px;
        }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px 10px 24px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 1.2rem;
            transition: var(--transition);
        }

        .icon-btn:hover {
            background: var(--btn-num-hover);
            color: var(--text-primary);
        }

        .nav-actions {
            display: flex;
            gap: 8px;
        }

        .display-screen {
            flex: 1;
            padding: 20px 28px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            word-break: break-all;
        }

        .expression-line {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 500;
            min-height: 28px;
            margin-bottom: 6px;
            opacity: 0.8;
            transition: var(--transition);
        }

        .result-line {
            font-size: 2.6rem;
            color: var(--text-primary);
            font-weight: 600;
            letter-spacing: -0.5px;
            line-height: 1.1;
            transition: var(--transition);
        }

        .keypad-container {
            background: var(--calc-bg);
            border-top-left-radius: 32px;
            border-top-right-radius: 32px;
            padding: 20px 18px 28px 18px;
            display: flex;
            gap: 12px;
        }

        .sci-side-panel {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 42%;
            animation: fadeIn 0.3s ease;
        }

        .calculator-card.landscape .sci-side-panel,
        .sci-side-panel.open {
            display: grid;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .main-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button.calc-btn {
            height: 54px;
            border: none;
            border-radius: 18px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            background-color: var(--btn-num-bg);
            color: var(--text-primary);
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button.calc-btn:hover {
            background-color: var(--btn-num-hover);
            transform: translateY(-2px);
        }

        button.calc-btn:active {
            transform: scale(0.94);
        }

        .btn-sci-item {
            background-color: var(--btn-sci-bg) !important;
            color: var(--btn-sci-color) !important;
            font-size: 0.95rem !important;
            border-radius: 16px !important;
            height: 46px !important;
        }

        .btn-var-item {
            background-color: var(--btn-var-bg) !important;
            color: var(--btn-var-color) !important;
            font-weight: 700 !important;
            font-style: italic;
        }

        .btn-op-item {
            color: var(--btn-op-color) !important;
            font-size: 1.4rem !important;
        }

        .btn-clear-item {
            color: #ef4444 !important;
        }

        .btn-equal-item {
            background: var(--btn-equal-bg) !important;
            color: #ffffff !important;
            box-shadow: 0 8px 20px var(--btn-equal-shadow) !important;
            border-radius: 22px !important;
        }

        /* VAULT (YASHIRINGAN ILOVALAR) PANEL STYLES */
        .vault-page {
            position: absolute;
            inset: 0;
            background: var(--calc-bg);
            z-index: 50;
            display: flex;
            flex-direction: column;
            transform: scale(0.9);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .vault-page.active {
            transform: scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .vault-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            border-bottom: 1px solid var(--btn-num-hover);
        }

        .vault-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            padding: 20px;
        }

        .app-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 14px 6px;
            min-width: 0;
            background: var(--btn-num-bg);
            border-radius: 20px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .app-remove-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            background: #dc2626;
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(220, 38, 38, 0.4);
            z-index: 5;
        }

        .empty-vault-msg {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            padding: 24px 12px;
            line-height: 1.5;
        }

        .app-picker-list {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .app-picker-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 14px;
            background: var(--btn-num-bg);
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition);
        }

        .app-picker-item.selected {
            background: var(--btn-var-bg);
            border-color: var(--btn-op-color);
        }

        .app-picker-icon {
            font-size: 1.3rem;
        }

        .media-grid {
            grid-template-columns: repeat(3, 1fr);
        }

        .media-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background: var(--btn-num-bg);
        }

        .media-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .media-badge {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.55);
            color: #ffffff;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 8px;
        }

        .app-card:hover {
            background: var(--btn-num-hover);
            transform: translateY(-3px);
        }

        .app-icon {
            font-size: 2.2rem;
        }

        .app-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .vault-footer {
            margin-top: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .vault-btn {
            padding: 14px;
            border-radius: 16px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            background: var(--btn-sci-bg);
            color: var(--btn-sci-color);
            transition: var(--transition);
        }

        .vault-btn-danger {
            background: #fee2e2;
            color: #dc2626;
        }

        /* CUSTOM MODAL (prompt()/alert() o'rniga) */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            width: 84%;
            background: var(--calc-bg);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--card-shadow);
            transform: scale(0.92);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .modal-message {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .modal-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid var(--btn-num-hover);
            background: var(--btn-num-bg);
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: 10px;
            outline: none;
        }

        .modal-input:focus {
            border-color: var(--btn-op-color);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-btn-cancel {
            background: var(--btn-num-bg);
            color: var(--text-secondary);
        }

        .modal-btn-confirm {
            background: var(--btn-op-color);
            color: #ffffff;
        }

        .toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: var(--text-primary);
            color: var(--calc-bg);
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Telefon ekranlari uchun: karta butun ekranni egallaydi */
        @media (max-width: 480px) {
            body { align-items: stretch; }
            .calculator-card, .calculator-card.landscape {
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                border-radius: 0;
                border: none;
            }
        }
    </style>
</head>
<body>

<div class="calculator-card" id="calcCard">
    <div class="header-nav">
        <button class="icon-btn" onclick="toggleOrientation()" title="Burish">⤢</button>
        <div class="nav-actions">
            <button class="icon-btn" onclick="toggleSciPanel()" title="Muhandislik va Tenglama">√̅</button>
            <button class="icon-btn" onclick="toggleTheme()" id="themeIcon" title="Rejim">🌙</button>
        </div>
    </div>
    <div class="display-screen">
        <div class="expression-line" id="expLine"></div>
        <div class="result-line" id="resLine">0</div>
    </div>

    <div class="keypad-container">
        <div class="sci-side-panel" id="sciPanel">
            <button class="calc-btn btn-var-item" onclick="addVal('x')">x</button>
            <button class="calc-btn btn-var-item" onclick="addVal('y')">y</button>
            <button class="calc-btn btn-sci-item" style="font-weight:bold; color:#10b981 !important;" onclick="addVal('=')">=</button>

            <button class="calc-btn btn-sci-item" onclick="addVal('/')">a/b</button>
            <button class="calc-btn btn-sci-item" onclick="addFunc('sin')">sin</button>
            <button class="calc-btn btn-sci-item" onclick="addFunc('cos')">cos</button>

            <button class="calc-btn btn-sci-item" onclick="addFunc('tan')">tan</button>
            <button class="calc-btn btn-sci-item" onclick="addFunc('log')">log</button>
            <button class="calc-btn btn-sci-item" onclick="addVal('^')">xⁿ</button>

            <button class="calc-btn btn-sci-item" onclick="addVal('pi')">π</button>
            <button class="calc-btn btn-sci-item" onclick="addFunc('sqrt')">√</button>
            <button class="calc-btn btn-sci-item" onclick="addVal('^2')">x²</button>
        </div>

        <div class="main-grid">
            <button class="calc-btn btn-clear-item" onclick="clearDisplay()">C</button>
            <button class="calc-btn btn-var-item" onclick="addVal('x')">x</button>
            <button class="calc-btn btn-var-item" onclick="addVal('y')">y</button>
            <button class="calc-btn btn-op-item" onclick="backspace()">⌫</button>

            <button class="calc-btn" onclick="addVal('7')">7</button>
            <button class="calc-btn" onclick="addVal('8')">8</button>
            <button class="calc-btn" onclick="addVal('9')">9</button>
            <button class="calc-btn btn-op-item" onclick="addVal('/')">÷</button>

            <button class="calc-btn" onclick="addVal('4')">4</button>
            <button class="calc-btn" onclick="addVal('5')">5</button>
            <button class="calc-btn" onclick="addVal('6')">6</button>
            <button class="calc-btn btn-op-item" onclick="addVal('*')">×</button>

            <button class="calc-btn" onclick="addVal('1')">1</button>
            <button class="calc-btn" onclick="addVal('2')">2</button>
            <button class="calc-btn" onclick="addVal('3')">3</button>
            <button class="calc-btn btn-op-item" onclick="addVal('-')">-</button>

            <button class="calc-btn btn-sci-item" style="font-weight:bold;" onclick="addVal('=')">=</button>
            <button class="calc-btn" onclick="addVal('0')">0</button>
            <button class="calc-btn" onclick="addVal(',')">,</button>
            <button class="calc-btn btn-op-item" onclick="addVal('+')">+</button>

            <button class="calc-btn btn-equal-item" id="solveBtn" style="grid-column: span 4; height: 50px !important;" onclick="compute()">SOLVE (YECHISH)</button>
        </div>
    </div>

    <!-- TOAST XABARI -->
    <div class="toast" id="toastMsg"></div>

    <!-- CUSTOM MODAL (parol so'rash / o'zgartirish uchun) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-message" id="modalMessage"></div>
            <input type="password" class="modal-input" id="modalInput1" placeholder="">
            <input type="password" class="modal-input" id="modalInput2" placeholder="" style="display:none;">
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" id="modalCancelBtn">Bekor qilish</button>
                <button class="modal-btn modal-btn-confirm" id="modalConfirmBtn">Tasdiqlash</button>
            </div>
        </div>
    </div>

    <!-- SECRET VAULT PANEL -->
    <div class="vault-page" id="vaultPage">
        <div class="vault-header">
            <div class="vault-title">🔒 Yashirin Omborxona</div>
            <div style="display:flex; gap:6px;">
                <button class="icon-btn" onclick="toggleEditMode()" id="editModeBtn" title="Tahrirlash">✏️</button>
                <button class="icon-btn" onclick="closeVault()">✕</button>
            </div>
        </div>

        <div class="app-grid" id="appGrid"></div>

        <div class="vault-footer">
            <button class="vault-btn" onclick="openMediaVault()">🖼️ Rasm/Video saqlash</button>
            <button class="vault-btn" onclick="openAppPicker()">➕ Ro'yxatga qo'shish</button>
            <button class="vault-btn" onclick="changePassword()">🔑 Parolni o'zgartirish</button>
            <button class="vault-btn vault-btn-danger" onclick="closeVault()">🔒 Chiqish va Qulflash</button>
        </div>
    </div>

    <!-- RASM / VIDEO VAULT -->
    <div class="vault-page" id="mediaVaultPage">
        <div class="vault-header">
            <div class="vault-title">🖼️ Rasm va Video</div>
            <button class="icon-btn" onclick="closeMediaVault()">✕</button>
        </div>

        <div class="app-grid media-grid" id="mediaGrid"></div>

        <div class="vault-footer">
            <button class="vault-btn" onclick="document.getElementById('mediaFileInput').click()">➕ Fayl qo'shish</button>
            <button class="vault-btn vault-btn-danger" onclick="closeMediaVault()">◀ Vaultga qaytish</button>
        </div>

        <input type="file" id="mediaFileInput" accept="image/*,video/*" multiple style="display:none;">
    </div>
</div>

<!-- ILOVA TANLASH MODALI (yashirish uchun) -->
<div class="modal-overlay" id="appPickerOverlay">
    <div class="modal-box">
        <div class="modal-title">➕ Maxfiy ro'yxatga qo'shish</div>
        <div class="modal-message">Ro'yxatga qo'shmoqchi bo'lgan nomlarni tanlang</div>
        <div class="app-picker-list" id="appPickerList"></div>
        <input type="text" class="modal-input" id="customAppInput" placeholder="Boshqa nom (ixtiyoriy)">
        <div class="modal-actions">
            <button class="modal-btn modal-btn-cancel" id="appPickerCancelBtn">Bekor qilish</button>
            <button class="modal-btn modal-btn-confirm" id="appPickerConfirmBtn">Qo'shish</button>
        </div>
    </div>
</div>



<script>
    const resLine = document.getElementById('resLine');
    const expLine = document.getElementById('expLine');
    const sciPanel = document.getElementById('sciPanel');
    const calcCard = document.getElementById('calcCard');
    const vaultPage = document.getElementById('vaultPage');
    const themeIcon = document.getElementById('themeIcon');
    const solveBtn = document.getElementById('solveBtn');

    // MAXFIY PAROL (STANDART: 1234)
    // Eslatma: bu demo muhitida brauzer xotirasi (localStorage) ishlamaydi,
    // shuning uchun parol shu sessiya davomida xotirada saqlanadi.
    // Haqiqiy ilovada buni serverga yoki qurilma xotirasiga saqlash kerak.
    let secretPasscode = '1234';
    try {
        const saved = localStorage.getItem('vc_passcode');
        if (saved && saved.length >= 4) secretPasscode = saved;
    } catch (e) { /* xotira mavjud emas - standart parol ishlatiladi */ }
    let pressTimer;

    function triggerVibration() {
        if (navigator.vibrate) navigator.vibrate(10);
    }

    function addVal(val) {
        triggerVibration();
        if (resLine.innerText === '0' || resLine.innerText === 'Xatolik') {
            resLine.innerText = val;
        } else {
            resLine.innerText += val;
        }
    }

    function addFunc(funcName) {
        triggerVibration();
        if (resLine.innerText === '0' || resLine.innerText === 'Xatolik') {
            resLine.innerText = funcName + '(';
        } else {
            resLine.innerText += funcName + '(';
        }
    }

    function clearDisplay() {
        triggerVibration();
        resLine.innerText = '0';
        expLine.innerText = '';
    }

    function backspace() {
        triggerVibration();
        if (resLine.innerText.length === 1 || resLine.innerText === 'Xatolik') {
            resLine.innerText = '0';
        } else {
            resLine.innerText = resLine.innerText.slice(0, -1);
        }
    }

    function toggleSciPanel() {
        triggerVibration();
        sciPanel.classList.toggle('open');
    }

    function toggleOrientation() {
        triggerVibration();
        calcCard.classList.toggle('landscape');
    }

    function toggleTheme() {
        triggerVibration();
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        themeIcon.innerText = isDark ? '☀️' : '🌙';
    }

    // VAULT (YASHIRIN OMBOR) FUNKSIYALARI

    // Vaultda ko'rsatiladigan (yashiringan) ilovalar ro'yxati.
    // Bu demo muhitida haqiqiy qurilma ilovalarini yashira olmaymiz —
    // shuning uchun ro'yxat sessiya davomida xotirada saqlanadi va
    // foydalanuvchi o'zi ilova qo'shishi/olib tashlashi mumkin.
    let vaultApps = [
        { icon: '📝', name: 'Eslatmalar' },
        { icon: '📁', name: 'Fayllar' },
        { icon: '📊', name: 'Hujjatlar' }
    ];

    // Qo'shish uchun tayyor ilovalar ro'yxati (hali vaultda bo'lmaganlari ko'rsatiladi)
    const presetApps = [
        { icon: '💬', name: 'Xabarlar' },
        { icon: '🌐', name: 'Havolalar' },
        { icon: '📷', name: 'Kamera' },
        { icon: '📞', name: 'Kontaktlar' },
        { icon: '💳', name: 'Bank ilovasi' },
        { icon: '📧', name: 'Pochta' },
        { icon: '🎵', name: 'Musiqa' },
        { icon: '🗺️', name: 'Xaritalar' },

    // ILOVA TANLASH MODALI (yashirish uchun)

    function openAppPicker() {

        appPickerList.innerHTML = '';

        const available = presetApps.filter(p => !vaultApps.some(a => a.name === p.name));

        if (available.length === 0) {

        triggerVibration();

    // RASM / VIDEO VAULT
    // Fayllar IndexedDB orqali qurilmaning ilova xotirasida saqlanadi.
    // saqlanadi — shu bilan ilova qayta ochilganda ham fayllar joyida turadi.
    // Diqqat: bu telefonning haqiqiy Galereyasidan faylni olib tashlamaydi —
    // bu shunchaki ilova ichidagi alohida, parol bilan himoyalangan xotira.
    // Rasm avtomatik kichraytiriladi; video hajmi cheklangan (taxminan 4MB),
    // chunki har bir yozuv hajmi 5MB dan oshmasligi kerak.
    const mediaVaultPage = document.getElementById('mediaVaultPage');
    const mediaGrid = document.getElementById('mediaGrid');
    const mediaFileInput = document.getElementById('mediaFileInput');
    const MAX_VIDEO_BYTES = 4 * 1024 * 1024;

    function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = () => reject(new Error('read failed'));
            reader.readAsDataURL(file);
        });
    }

    function resizeImageFile(file, maxDim, quality) {
        maxDim = maxDim || 900;
        quality = quality || 0.72;
        return new Promise((resolve, reject) => {
            readFileAsDataURL(file).then((dataUrl) => {
                const img = new Image();
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;
                    if (width > maxDim || height > maxDim) {
                        if (width >= height) {
                            height = Math.round(height * (maxDim / width));
                            width = maxDim;
                        } else {
                            width = Math.round(width * (maxDim / height));
                            height = maxDim;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => reject(new Error('image decode failed'));
                img.src = dataUrl;
            }).catch(reject);
        });
    }

    // OFFLINE ANDROID STORAGE (IndexedDB)
    // Capacitor WebView uchun internet talab qilmaydi. Rasm/video qurilmaning
    // ilova ichidagi IndexedDB xotirasida saqlanadi.
    const VAULT_DB_NAME = 'VaultCalculatorDB';
    const VAULT_DB_VERSION = 1;
    const VAULT_STORE = 'media';

    function openVaultDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(VAULT_DB_NAME, VAULT_DB_VERSION);
            request.onupgradeneeded = () => {
                const db = request.result;
                if (!db.objectStoreNames.contains(VAULT_STORE)) {
                    db.createObjectStore(VAULT_STORE, { keyPath: 'key' });
                }
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    async function vaultSet(record) {
        const db = await openVaultDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(VAULT_STORE, 'readwrite');
            tx.objectStore(VAULT_STORE).put(record);
            tx.oncomplete = () => { db.close(); resolve(true); };
            tx.onerror = () => { db.close(); reject(tx.error); };
        });
    }

    async function vaultList() {
        const db = await openVaultDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(VAULT_STORE, 'readonly');
            const request = tx.objectStore(VAULT_STORE).getAll();
            request.onsuccess = () => { db.close(); resolve(request.result || []); };
            request.onerror = () => { db.close(); reject(request.error); };
        });
    }

    async function vaultDelete(key) {
        const db = await openVaultDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(VAULT_STORE, 'readwrite');
            tx.objectStore(VAULT_STORE).delete(key);
            tx.oncomplete = () => { db.close(); resolve(true); };
            tx.onerror = () => { db.close(); reject(tx.error); };
        });
    }

    async function handleMediaFiles(fileList) {
        const files = Array.from(fileList || []);
        if (files.length === 0) return;

        showToast('Yuklanmoqda...');
        let added = 0;
        let skipped = 0;

        for (const file of files) {
            try {
                const isVideo = file.type.startsWith('video/');
                let dataUrl;

                if (isVideo) {
                    if (file.size > MAX_VIDEO_BYTES) {
                        skipped++;
                        continue;
                    }
                    dataUrl = await readFileAsDataURL(file);
                } else {
                    dataUrl = await resizeImageFile(file);
                }

                const key = 'vault-media:' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
                const record = { type: isVideo ? 'video' : 'image', dataUrl: dataUrl, ts: Date.now() };
                const result = await vaultSet({ key: key, ...record });

                if (result) {
                    added++;
                } else {
                    skipped++;
                }
            } catch (err) {
                skipped++;
            }
        }

        await loadMediaVault();

        if (added > 0) {
            showToast(added + ' ta fayl saqlandi' + (skipped > 0 ? ', ' + skipped + " ta o'tkazib yuborildi (hajmi katta)" : ''));
        } else {
            showToast("Hech narsa saqlanmadi — fayl hajmi juda katta bo'lishi mumkin");
        }
    }

    async function loadMediaVault() {
        mediaGrid.innerHTML = '<div class="empty-vault-msg">Yuklanmoqda...</div>';

        try {
            const records = await vaultList();
            const keys = records.map(r => r.key);

            if (keys.length === 0) {
                mediaGrid.innerHTML = '<div class="empty-vault-msg">Hozircha saqlangan rasm yoki video yo\'q.<br>Pastdagi "Fayl qo\'shish" tugmasini bosing.</div>';
                return;
            }

            const items = [];
            for (const record of records) {
                try {
                    if (record && record.key) items.push(record);
                } catch (e) {
                    // Yaroqsiz yozuvni o'tkazib yuboramiz.
                }
            }

            items.sort((a, b) => (b.ts || 0) - (a.ts || 0));

            mediaGrid.innerHTML = '';
            items.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'media-card';

                const removeBtn = document.createElement('button');
                removeBtn.className = 'app-remove-btn';
                removeBtn.innerText = '×';
                removeBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    triggerVibration();
                    try {
                        await vaultDelete(item.key);
                        showToast('Fayl olib tashlandi');
                    } catch (err) {
                        showToast("O'chirishda xatolik yuz berdi");
                    }
                    loadMediaVault();
                });
                card.appendChild(removeBtn);

                if (item.type === 'video') {
                    const vid = document.createElement('video');
                    vid.src = item.dataUrl;
                    vid.className = 'media-thumb';
                    vid.muted = true;
                    vid.playsInline = true;
                    vid.controls = true;
                    card.appendChild(vid);

                    const badge = document.createElement('div');
                    badge.className = 'media-badge';
                    badge.innerText = '▶ video';
                    card.appendChild(badge);
                } else {
                    const img = document.createElement('img');
                    img.src = item.dataUrl;
                    img.className = 'media-thumb';
                    card.appendChild(img);
                }

                mediaGrid.appendChild(card);
            });
        } catch (err) {
            mediaGrid.innerHTML = '<div class="empty-vault-msg">Yuklashda xatolik yuz berdi.</div>';
        }
    }

        triggerVibration();
        mediaVaultPage.classList.add('active');

    // CUSTOM MODAL VA TOAST
    // Ba'zi muhitlarda (masalan sandboxed preview/iframe) brauzerning
    // window.prompt() va window.alert() funksiyalari bloklanadi va sukut
    // saqlaydi — tashqi ko'rinishda tugma "ishlamayapti"dek tuyuladi.

    const modalOverlay = document.getElementById('modalOverlay');

    function changePassword() {
        triggerVibration();
        openModal({

                modalInput1.value = '';

                setModalError("Yangi parol kamida 4 ta raqamdan iborat bo'lishi kerak!");
                modalInput2.value = '';
                modalInput2.focus();
                return;
            }

            secretPasscode = newPass;
            try { localStorage.setItem('vc_passcode', newPass); } catch (e) {}
            closeModal();
            showToast("Parol muvaffaqiyatli o'zgartirildi!");
        };

    // TUGMANI UZOQ BOSIB TURGANDA OCHISH LOGIKASI
    // Uzoq bosish vaultni to'g'ridan-to'g'ri OCHMAYDI — u faqat parol
    // so'raydigan oynani chaqiradi. Shu bilan vaultga parolni bilmasdan
    // kirib bo'lmaydi.

    // OFFLINE MATH ENGINE
    // Faqat kalkulyator uchun kerak bo'lgan amallar: + - * / ^, sin cos tan log sqrt, pi, x, y.
    // Tashqi CDN yoki internet talab qilinmaydi.
    const math = {
        _normalize(expr) {
            let e = String(expr)
                .replace(/\^/g, '**')
                .replace(/\bpi\b/g, 'Math.PI')
                .replace(/\bsqrt\s*\(/g, 'Math.sqrt(')
                .replace(/\bsin\s*\(/g, 'Math.sin(')
                .replace(/\bcos\s*\(/g, 'Math.cos(')
                .replace(/\btan\s*\(/g, 'Math.tan(')
                .replace(/\blog\s*\(/g, 'Math.log10(');
            if (!/^[0-9+\-*/().,\s*x yMathPIa-zA-Z_]+$/.test(e)) throw new Error('invalid expression');
            if (/\b(?:constructor|prototype|__proto__|Function|eval|window|document|globalThis)\b/i.test(e)) throw new Error('invalid expression');
            return e;
        },
        evaluate(expr, scope = {}) {
            const e = this._normalize(expr);
            const x = Number(scope.x ?? 0), y = Number(scope.y ?? 0);
            const fn = Function('x','y','Math','"use strict"; return (' + e + ');');
            return fn(x, y, Math);
        },
        fraction(value) {
            const x = Number(value);
            if (!Number.isFinite(x)) throw new Error('invalid fraction');
            const sign = x < 0 ? -1 : 1;
            let n = Math.abs(x);
            const maxDen = 100000;
            let h1 = 1, h0 = 0, k1 = 0, k0 = 1;
            let b = n;
            for (let i = 0; i < 30; i++) {
                const a = Math.floor(b);
                const h2 = a * h1 + h0, k2 = a * k1 + k0;
                if (k2 > maxDen) break;
                h0 = h1; h1 = h2; k0 = k1; k1 = k2;
                const frac = b - a;
                if (frac < 1e-12) break;
                b = 1 / frac;
            }
            return { s: sign, n: h1, d: k1 || 1 };
        },
        parse(expr) {
            const self = this;
            return {
                compile() {
                    return { evaluate(scope = {}) { return self.evaluate(expr, scope); } };
                }
            };
        }
    };

    // HISOB-KITOB VA PAROL TEKSHIRISH
    function compute() {
        triggerVibration();
        let inputVal = resLine.innerText;

        // PAROL TEKSHIRISH (faqat "SOLVE" tugmasini oddiy bosganda)
        if (inputVal === secretPasscode) {
            openVault();
            return;
        }

        // Matematik ifoda uchun vergulni nuqtaga almashtiramiz
        let mathExpr = inputVal.replace(/,/g, '.');

        try {
            // TENGLAMA YECHISH
            if (mathExpr.includes('=')) {
                let parts = mathExpr.split('=');
                if (parts.length !== 2 || parts[1].trim() === '') {
                    throw new Error('invalid equation');
                }
                let left = parts[0];
                let right = parts[1];
                let eqExp = `(${left}) - (${right})`;
                let node = math.parse(eqExp);
                let compiled = node.compile();

                let xVal = 0;
                for (let i = 0; i < 100; i++) {
                    let f = compiled.evaluate({ x: xVal, y: 0 });
                    let fPrime = (compiled.evaluate({ x: xVal + 0.00001, y: 0 }) - f) / 0.00001;
                    if (Math.abs(fPrime) < 1e-12) break;
                    let nextX = xVal - f / fPrime;
                    if (Math.abs(nextX - xVal) < 1e-7) {
                        xVal = nextX;
                        break;
                    }
                    xVal = nextX;
                }

                if (!isFinite(xVal)) {
                    throw new Error('no solution');
                }

                let resultString = "";
                if (Math.abs(xVal - Math.round(xVal)) < 1e-6) {
                    resultString = `x = ${Math.round(xVal)}`;
                } else {
                    let fractionRes = math.fraction(xVal);
                    if (fractionRes.d < 1000) {
                        let sign = fractionRes.s < 0 ? "-" : "";
                        resultString = `x = ${sign}${fractionRes.n}/${fractionRes.d}`;
                    } else {
                        resultString = `x = ${parseFloat(xVal.toFixed(4))}`;
                    }
                }

                expLine.innerText = inputVal;
                resLine.innerText = resultString;
                return;
            }

            // ODDIY HISOB
            let evaluated = math.evaluate(mathExpr);

            if (typeof evaluated !== 'number' || !isFinite(evaluated)) {
                throw new Error('invalid result');
            }

            let resultString = "";
            if (Number.isInteger(evaluated)) {
                resultString = evaluated.toString();
            } else {
                let fractionRes = math.fraction(evaluated);
                if (fractionRes.d === 1) {
                    resultString = (fractionRes.s * fractionRes.n).toString();
                } else if (fractionRes.d < 10000) {
                    let sign = fractionRes.s < 0 ? "-" : "";
                    resultString = `${sign}${fractionRes.n}/${fractionRes.d}`;
                } else {
                    resultString = parseFloat(evaluated.toFixed(6)).toString();
                }
            }

            expLine.innerText = inputVal + ' =';
            resLine.innerText = resultString;

        } catch (e) {
            expLine.innerText = '';
            resLine.innerText = 'Xatolik';
        }
    }

    // KEYBOARD INPUT
    document.addEventListener('keydown', (e) => {
        if (e.key >= '0' && e.key <= '9') addVal(e.key);
        if (['+', '-', '*', '/', '(', ')', 'x', 'y'].includes(e.key)) addVal(e.key);
        if (e.key === '.' || e.key === ',') addVal(',');
        if (e.key === '=') compute();
        if (e.key === 'Enter') compute();
        if (e.key === 'Backspace') backspace();
        if (e.key === 'Escape') clearDisplay();
    });
